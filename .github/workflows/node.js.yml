name: CI

# El despliegue lo hace Cloudflare Pages directamente desde GitHub.
# Este workflow valida tipos y que el sitio compile en cada push/PR.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci
      - run: npm run check
      - run: npm run build

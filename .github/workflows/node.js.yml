name: CI - Build Angular App

# El despliegue lo realiza Cloudflare Pages directamente desde GitHub.
# Este workflow solo valida que el proyecto compile en cada push/PR.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Build Angular app
        run: npm run build -- --configuration=production

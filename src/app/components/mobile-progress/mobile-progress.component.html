<div
	class="mobile-progress"
	role="progressbar"
	aria-label="Progreso de lectura"
	[attr.aria-valuenow]="percent()"
	aria-valuemin="0"
	aria-valuemax="100"
>
	<span class="mobile-progress__label">{{ activeLabel() }}</span>
	<span class="mobile-progress__track" aria-hidden="true">
		<span class="mobile-progress__fill" [style.transform]="'scaleX(' + trail() + ')'"></span>
	</span>
</div>

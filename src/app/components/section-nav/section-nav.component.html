<nav class="section-nav" aria-label="Secciones">
	<span class="section-nav__rail" aria-hidden="true">
		<span class="section-nav__fill" [style.transform]="'scaleY(' + trail() + ')'"></span>
	</span>
	<span
		class="section-nav__thumb"
		aria-hidden="true"
		[style.transform]="'translateY(' + activeIndex() * step + 'rem)'"
	></span>
	<ul>
		<li *ngFor="let section of sections(); let i = index">
			<a
				[href]="'#' + section.id"
				class="section-nav__link"
				[class.section-nav__link--lit]="i <= litIndex()"
				[class.section-nav__link--active]="activeId() === section.id"
				[attr.aria-current]="activeId() === section.id ? 'true' : null"
				(click)="scrollTo($event, section.id)"
			>
				<span class="section-nav__label">{{ section.label }}</span>
				<span class="section-nav__dot" aria-hidden="true"></span>
			</a>
		</li>
	</ul>
</nav>

<div class="container">
	<div class="container__card--title">
		<h1>Experiencia</h1>
	</div>

	<ol class="timeline">
		<li
			class="timeline__item reveal"
			*ngFor="let exp of experiences; let i = index; let last = last"
			appReveal
			[revealDelay]="i * 90"
			[class.timeline__item--current]="last"
		>
			<div class="timeline__rail" aria-hidden="true">
				<span class="timeline__node" [style.background-color]="exp.accentColor" [style.color]="exp.accentColor"></span>
				<span class="timeline__period">{{ exp.period }}</span>
			</div>

			<div class="container__card--body-container">
				<div class="container__card--info">
					<h2>
						<span [class]="exp.accentClass">{{ exp.company }}</span> {{ exp.roleTitle }}
					</h2>
					<app-expandable>
						<p *ngFor="let paragraph of exp.paragraphs">
							<ng-container *ngFor="let seg of paragraph">
								<span *ngIf="seg.highlight; else plain">{{ seg.text }}</span>
								<ng-template #plain>{{ seg.text }}</ng-template>
							</ng-container>
						</p>
					</app-expandable>
				</div>
				<div class="container__card--technologies">
					<div class="container__card--technology" *ngFor="let tech of exp.technologies" [style.background-color]="tech.color">
						{{ tech.name }}
					</div>
				</div>
				<div class="container__card--roles">
					<div class="container__card--role" [ngClass]="role.variant" *ngFor="let role of exp.roles">{{ role.label }}</div>
				</div>
			</div>

			<div class="container__card--body-image" appLightbox [lightboxSrc]="exp.image + '.webp'" [lightboxAlt]="exp.alt">
				<picture>
					<source [srcset]="exp.image + '.avif'" type="image/avif" />
					<source [srcset]="exp.image + '.webp'" type="image/webp" />
					<img
						[src]="exp.image + '.png'"
						[alt]="exp.alt"
						[width]="exp.width"
						[height]="exp.height"
						loading="lazy"
						decoding="async"
					/>
				</picture>
			</div>
		</li>
	</ol>
</div>

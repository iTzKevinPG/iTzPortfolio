<div
	class="lightbox"
	*ngIf="lightbox.current() as image"
	role="dialog"
	aria-modal="true"
	aria-label="Imagen ampliada"
	(click)="close()"
>
	<button #closeBtn type="button" class="lightbox__close" aria-label="Cerrar imagen" (click)="close()">
		<span aria-hidden="true">&times;</span>
	</button>
	<img class="lightbox__img" [src]="image.src" [alt]="image.alt" (click)="$event.stopPropagation()" />
</div>
